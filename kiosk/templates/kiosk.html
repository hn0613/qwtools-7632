{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>F-Klubben</title>

    <link href="{% static "kiosk/kiosk.css" %}" rel="stylesheet">
</head>

<body>
    <div class="dummy front"></div>
    <div class="dummy"></div>

    <script>
    (function() {
        "use strict";

        var buffers = [].slice.call(document.querySelectorAll(".dummy"));
        var frontIdx = 0;
        var currentId = -1;
        var displayDuration = 10000;
        var nextDuration = 10000;
        var contentReady = true;
        var pendingAdvance = false;
        var timerId = null;
        var activeXhr = null;
        var FALLBACK_BG = 'url("{% static "kiosk/kioskbg.png" %}")';

        function getBack() {
            return buffers[1 - frontIdx];
        }

        // Release media resources before replacing buffer content.
        // This prevents video/iframe accumulation over long runtimes.
        function cleanBuffer(el) {
            var videos = el.getElementsByTagName("video");
            for (var i = videos.length - 1; i >= 0; i--) {
                videos[i].pause();
            }
            var iframes = el.getElementsByTagName("iframe");
            for (var i = iframes.length - 1; i >= 0; i--) {
                iframes[i].src = "about:blank";
            }
            el.innerHTML = "";
            el.style.backgroundImage = "";
        }

        function renderContent(el, item) {
            cleanBuffer(el);
            if (item.has_media) {
                if (item.is_image) {
                    el.style.backgroundImage = 'url("' + item.url + '")';
                } else {
                    el.innerHTML =
                        '<center class="scale">' +
                        '<video class="scale" autoplay muted loop>' +
                        '<source src="' + item.url + '" type="video/mp4">' +
                        '</video></center>';
                }
            } else {
                el.innerHTML =
                    '<iframe class="scale" src="' + item.url + '" ' +
                    'style="width:100%;height:100%;border:none;"></iframe>';
            }
        }

        function renderFallback(el) {
            cleanBuffer(el);
            el.style.backgroundImage = FALLBACK_BG;
        }

        function swap() {
            buffers[frontIdx].classList.remove("front");
            frontIdx = 1 - frontIdx;
            buffers[frontIdx].classList.add("front");
        }

        function scheduleNext(delay) {
            if (timerId !== null) {
                clearTimeout(timerId);
            }
            timerId = setTimeout(advance, delay);
        }

        // Core state transition: swap visible buffer and begin loading next item.
        // Only proceeds when the back buffer has content ready (contentReady === true).
        function doAdvance() {
            pendingAdvance = false;
            swap();
            contentReady = false;
            displayDuration = nextDuration;
            scheduleNext(displayDuration);
            loadNext();
        }

        function advance() {
            timerId = null;
            if (!contentReady) {
                // Timer fired but next content isn't loaded yet.
                // Mark as pending — doAdvance will run as soon as content arrives.
                pendingAdvance = true;
                return;
            }
            doAdvance();
        }

        function onContentLoaded() {
            contentReady = true;
            if (pendingAdvance) {
                doAdvance();
            }
        }

        function handleLoadFailure() {
            var back = getBack();
            currentId = -1;
            nextDuration = 10000;
            renderFallback(back);
            onContentLoaded();
        }

        function loadNext() {
            if (activeXhr) {
                activeXhr.onload = null;
                activeXhr.onerror = null;
                activeXhr.ontimeout = null;
                activeXhr.abort();
                activeXhr = null;
            }

            var back = getBack();
            var xhr = new XMLHttpRequest();
            activeXhr = xhr;

            xhr.onload = function() {
                if (xhr !== activeXhr) return;
                activeXhr = null;
                if (xhr.status === 200) {
                    try {
                        var item = JSON.parse(xhr.responseText);
                        currentId = item.id;
                        nextDuration = item.duration || 10000;
                        renderContent(back, item);
                        onContentLoaded();
                    } catch (e) {
                        handleLoadFailure();
                    }
                } else {
                    handleLoadFailure();
                }
            };

            xhr.onerror = function() {
                if (xhr !== activeXhr) return;
                activeXhr = null;
                handleLoadFailure();
            };

            xhr.ontimeout = function() {
                if (xhr !== activeXhr) return;
                activeXhr = null;
                handleLoadFailure();
            };

            xhr.open("GET", currentId === -1
                ? "/kiosk/random"
                : "/kiosk/next_real/" + currentId + "/",
                true);
            xhr.timeout = 15000;
            xhr.send(null);
        }

        // Start the cycle
        advance();
    })();
    </script>
</body>

</html>
