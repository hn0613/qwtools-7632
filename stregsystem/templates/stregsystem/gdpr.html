{% comment %}
Blurs sensitive user info after 5 seconds.
Uses class-based blur (no @keyframes) to avoid timing races.
Text is kept in DOM for accessibility; CSS blur provides visual privacy.
{% endcomment %}
<style>
	.username,
	.remainingbalance {
		display: inline-block;
		padding: 0 4px;
		transform-origin: 50% 60%;
		transition: all 0.3s ease;
		border-radius: 0.25em;
	}
	.username--blurred,
	.remainingbalance--blurred {
		background-color: currentcolor;
		-webkit-user-select: none;
		user-select: none;
		filter: blur(0.3em);
		opacity: 0.4;
		transform: scaleY(0.7);
		min-width: 35px;
	}
</style>
<script type="module">
	setTimeout(() => {
		for (const element of document.querySelectorAll(
			".username, .remainingbalance",
		)) {
			element.classList.add('username--blurred');
		}
	}, 5000);
</script>
